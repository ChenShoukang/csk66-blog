name: Deploy to EdgeOne

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-edgeone
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to EdgeOne Pages
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          EDGEONE_PAGES_API_REGION: china
        run: |
          for i in 1 2 3; do
            echo "Deploy attempt $i..."
            npx --yes edgeone@1.6.47 makers deploy dist -n 001 -e production -t "$EDGEONE_API_TOKEN" && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Deploy failed after 3 attempts"
          exit 1
